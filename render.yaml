services:
  # 1. Node.js Backend API
  - type: web
    name: agrilink-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://agrilink-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://agrilink-frontend.onrender.com
      - key: FLASK_API_URL
        value: https://agrilink-ai.onrender.com/api
      - key: PAYMENT_MODE
        value: DEMO
      - key: CHAPA_SECRET_KEY
        sync: false

  # 2. Flask AI Backend
  - type: web
    name: agrilink-ai
    env: python
    rootDir: flask_ai
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PORT
        value: 5001
      - key: GEMINI_API_KEY
        sync: false

  # 3. FastAPI Recommendation Service
  - type: web
    name: agrilink-recommender
    env: python
    rootDir: fastapi_recommender
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0

  # 4. React/Vite Frontend
  - type: web
    name: agrilink-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://agrilink-backend.onrender.com
      - key: VITE_SOCKET_URL
        value: https://agrilink-backend.onrender.com
      - key: VITE_FLASK_API_URL
        value: https://agrilink-ai.onrender.com/api
      - key: VITE_RECOMMENDER_URL
        value: https://agrilink-recommender.onrender.com
